<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pod-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F8FF"/>
      <stop offset="100%" stop-color="#D9EEFF"/>
    </linearGradient>
    <linearGradient id="gun-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="60%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="foam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="shadow-pod-c" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-tool-c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#171C24" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- 底托圆角背景 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#pod-c)" filter="url(#shadow-pod-c)" stroke="#CCE7FF" stroke-width="1.5"/>
  <!-- 清洁高压水枪主体 -->
  <g filter="url(#shadow-tool-c)">
    <path d="M 28 42 L 68 42 L 68 48 L 28 48 Z" fill="#9CA3AF"/>
    <rect x="22" y="40" width="8" height="10" rx="2" fill="#F59E0B"/>
    <path d="M 64 38 L 84 38 A 4 4 0 0 1 88 42 L 88 56 L 96 82 A 4 4 0 0 1 92 88 L 80 88 A 4 4 0 0 1 76 84 L 72 58 L 64 58 Z" fill="url(#gun-metal)"/>
    <path d="M 72 54 L 62 54 L 62 68 L 74 68" fill="none" stroke="url(#gun-metal)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 69 56 L 67 64" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 水花与洁净泡沫气泡群 -->
  <g filter="url(#shadow-tool-c)">
    <path d="M 26 28 C 34 36 36 46 26 54 C 16 46 18 36 26 28 Z" fill="url(#water-grad)"/>
    <circle cx="48" cy="28" r="9" fill="url(#foam-grad)" opacity="0.95" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="2.5" fill="#FFFFFF"/>
    <circle cx="66" cy="24" r="6" fill="url(#foam-grad)" opacity="0.9" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="34" cy="74" r="7" fill="url(#foam-grad)" opacity="0.92" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="32" cy="72" r="2" fill="#FFFFFF"/>
    <path d="M 92 24 Q 96 28 100 28 Q 96 28 92 32 Q 92 28 88 28 Q 92 28 92 24 Z" fill="#FBBF24"/>
    <path d="M 38 88 Q 41 91 44 91 Q 41 91 38 94 Q 38 91 35 91 Q 38 91 38 88 Z" fill="#38BDF8"/>
  </g>
</svg>