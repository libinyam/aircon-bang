<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pod-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="drill-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="drill-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow-pod-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D97706" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-tool-m" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#171C24" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- 底托圆角背景 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#pod-m)" filter="url(#shadow-pod-m)" stroke="#FDE68A" stroke-width="1.5"/>
  <!-- 专业锂电钻主体 -->
  <g filter="url(#shadow-tool-m)">
    <path d="M 22 42 L 36 42 L 36 48 L 22 48 Z" fill="url(#drill-metal)"/>
    <polygon points="18,45 24,41 24,49" fill="#CBD5E1"/>
    <rect x="36" y="39" width="12" height="14" rx="2" fill="#1E293B"/>
    <path d="M 46 34 L 84 34 A 6 6 0 0 1 90 40 L 90 56 A 4 4 0 0 1 86 60 L 74 60 L 78 86 A 4 4 0 0 1 74 90 L 58 90 A 4 4 0 0 1 54 86 L 54 58 L 46 58 A 4 4 0 0 1 42 54 L 42 38 A 4 4 0 0 1 46 34 Z" fill="url(#drill-body)"/>
    <path d="M 64 62 L 74 62 L 72 84 L 62 84 Z" fill="#1E293B"/>
    <line x1="56" y1="42" x2="76" y2="42" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="56" y1="47" x2="72" y2="47" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <rect x="52" y="86" width="30" height="10" rx="3" fill="#1E293B"/>
    <rect x="56" y="89" width="6" height="4" rx="1" fill="#10B981"/>
    <circle cx="60" cy="54" r="2.5" fill="#EF4444"/>
  </g>
  <!-- 铜管配件 / 移机安装小标识 -->
  <g transform="translate(82, 28)" filter="url(#shadow-tool-m)">
    <circle cx="14" cy="14" r="14" fill="#EA580C"/>
    <path d="M 8 14 L 13 19 L 21 9" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>