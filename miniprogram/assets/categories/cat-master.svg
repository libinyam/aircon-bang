<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pod-master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0"/>
      <stop offset="100%" stop-color="#FFE4D6"/>
    </linearGradient>
    <linearGradient id="toolbox-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA6E2A"/>
      <stop offset="50%" stop-color="#F25B15"/>
      <stop offset="100%" stop-color="#C94200"/>
    </linearGradient>
    <linearGradient id="toolbox-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow-pod-master" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#F25B15" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-item-master" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#171C24" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- 底托圆角背景 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#pod-master)" filter="url(#shadow-pod-master)" stroke="#FFD8C2" stroke-width="1.5"/>
  <!-- 专业维修工具箱主体 -->
  <g filter="url(#shadow-item-master)">
    <!-- 顶部金属提手 -->
    <path d="M 46 36 C 46 26 82 26 82 36" fill="none" stroke="url(#toolbox-metal)" stroke-width="6" stroke-linecap="round"/>
    <!-- 工具箱上盖与箱体 -->
    <rect x="22" y="44" width="84" height="46" rx="8" fill="url(#toolbox-body)"/>
    <rect x="20" y="38" width="88" height="16" rx="5" fill="#FA7C3D"/>
    <!-- 中间金属锁扣 -->
    <rect x="56" y="46" width="16" height="14" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="64" cy="53" r="2.5" fill="#334155"/>
    <!-- 左右加强筋与黑色护角 -->
    <rect x="22" y="76" width="14" height="14" rx="3" fill="#1E293B"/>
    <rect x="92" y="76" width="14" height="14" rx="3" fill="#1E293B"/>
    <line x1="28" y1="62" x2="48" y2="62" stroke="#FF9D6E" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="62" x2="100" y2="62" stroke="#FF9D6E" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 认证星徽盾牌 -->
  <g transform="translate(78, 64)" filter="url(#shadow-item-master)">
    <path d="M 18 4 L 32 9 V 19 C 32 28 18 34 18 34 C 18 34 4 28 4 19 V 9 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="18,10 20.5,15 26,15.8 22,19.7 23,25.2 18,22.5 13,25.2 14,19.7 10,15.8 15.5,15" fill="#FBBF24"/>
  </g>
</svg>