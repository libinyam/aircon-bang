<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pod-shop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FC"/>
      <stop offset="100%" stop-color="#E2EDF8"/>
    </linearGradient>
    <linearGradient id="box-cardboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="unit-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow-pod-shop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-item-shop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#171C24" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- 底托圆角背景 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#pod-shop)" filter="url(#shadow-pod-shop)" stroke="#CDE0F5" stroke-width="1.5"/>
  <!-- 包装箱与空调外机 -->
  <g filter="url(#shadow-item-shop)">
    <!-- 纸箱后景 -->
    <rect x="24" y="44" width="46" height="48" rx="6" fill="url(#box-cardboard)"/>
    <path d="M 24 54 L 70 54" stroke="#78350F" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="36" y="58" width="14" height="20" rx="2" fill="#FEF3C7" opacity="0.85"/>
    <line x1="39" y1="64" x2="47" y2="64" stroke="#D97706" stroke-width="2"/>
    <line x1="39" y1="69" x2="45" y2="69" stroke="#D97706" stroke-width="2"/>
    <!-- 前置微立体空调外机 -->
    <rect x="48" y="32" width="56" height="52" rx="8" fill="url(#unit-white)"/>
    <!-- 外机风扇保护罩 -->
    <circle cx="72" cy="58" r="18" fill="#CBD5E1"/>
    <circle cx="72" cy="58" r="14" fill="#64748B"/>
    <circle cx="72" cy="58" r="4" fill="#334155"/>
    <!-- 扇叶 -->
    <path d="M 72 46 C 76 46 76 56 72 58 C 68 56 68 46 72 46 Z" fill="#94A3B8"/>
    <path d="M 72 70 C 76 70 76 60 72 58 C 68 60 68 70 72 70 Z" fill="#94A3B8"/>
    <path d="M 60 58 C 60 54 70 54 72 58 C 70 62 60 62 60 58 Z" fill="#94A3B8"/>
    <path d="M 84 58 C 84 54 74 54 72 58 C 74 62 84 62 84 58 Z" fill="#94A3B8"/>
    <!-- 顶盖高光面 -->
    <path d="M 52 32 L 100 32 A 4 4 0 0 1 104 36 L 104 38 L 48 38 L 48 36 A 4 4 0 0 1 52 32 Z" fill="#FFFFFF"/>
  </g>
  <!-- 验货质保绿色小徽标 -->
  <g transform="translate(82, 68)" filter="url(#shadow-item-shop)">
    <circle cx="16" cy="16" r="15" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>