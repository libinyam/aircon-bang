<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  .card { width: 100vw; height: 100vh; background: linear-gradient(160deg, #FF7A2E 0%, #FF6A1A 55%, #F25A00 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
  .mark { width: 38vh; height: 38vh; }
  .name { font-size: 13vh; font-weight: 800; color: #FFFFFF; letter-spacing: 1.2vh; }
  .tag { font-size: 4.6vh; font-weight: 500; color: #FFE3CF; letter-spacing: 0.6vh; }
</style>
</head>
<body>
<div class="card">
  <svg class="mark" viewBox="0 0 96 96">
    <path d="M 74.9 45.4 A 17 17 0 1 1 59.6 29.1" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
    <line x1="43" y1="61" x2="25" y2="79" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"></line>
    <line x1="76" y1="13" x2="76" y2="35" stroke="#A9E9FF" stroke-width="6.5" stroke-linecap="round"></line>
    <line x1="66.5" y1="18.5" x2="85.5" y2="29.5" stroke="#A9E9FF" stroke-width="6.5" stroke-linecap="round"></line>
    <line x1="85.5" y1="18.5" x2="66.5" y2="29.5" stroke="#A9E9FF" stroke-width="6.5" stroke-linecap="round"></line>
  </svg>
  <div class="name">空调帮</div>
  <div class="tag">同城师傅上门 · 当面付款不代收</div>
</div>
</body>
</html>
