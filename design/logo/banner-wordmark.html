<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  .row { width: 100vw; height: 100vh; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 7vh; }
  .badge { width: 72vh; height: 72vh; border-radius: 18vh; background: #FF6A1A; display: flex; align-items: center; justify-content: center; flex: none; }
  .badge svg { width: 62vh; height: 62vh; }
  .name { font-size: 34vh; font-weight: 800; color: #16181C; letter-spacing: 2.4vh; }
</style>
</head>
<body>
<div class="row">
  <div class="badge">
    <svg viewBox="0 0 96 96">
      <path d="M 74.9 45.4 A 17 17 0 1 1 59.6 29.1" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
      <line x1="43" y1="61" x2="25" y2="79" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"></line>
      <line x1="76" y1="13" x2="76" y2="35" stroke="#A9E9FF" stroke-width="6.5" stroke-linecap="round"></line>
      <line x1="66.5" y1="18.5" x2="85.5" y2="29.5" stroke="#A9E9FF" stroke-width="6.5" stroke-linecap="round"></line>
      <line x1="85.5" y1="18.5" x2="66.5" y2="29.5" stroke="#A9E9FF" stroke-width="6.5" stroke-linecap="round"></line>
    </svg>
  </div>
  <div class="name">空调快修帮</div>
</div>
</body>
</html>
