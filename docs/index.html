/* ===================== 订单详情(双视角) ===================== */
function timelineOf(o) {
  var nodes = [
    { label: '发布订单', time: o.timeline.pub },
    { label: '师傅接单', time: o.timeline.accept },
    { label: '维修完成', time: o.timeline.finish },
    { label: '确认完成', time: o.timeline.confirm }
  ];
  var curIdx = { published: -1, accepted: 1, pending_confirm: 2, completed: 4, cancelled: -2 }[o.status];
  return nodes.map(function (n, i) {
    var st = 'future';
    if (o.status === 'cancelled') { st = i <= 0 ? 'done' : 'future'; }
    else if (i < curIdx) st = 'done';
    else if (i === curIdx) st = 'current';
    if (o.status === 'completed') st = 'done';
    return '<div class="tl-node tl-node--' + st + '"><div class="tl-dot"><div class="tl-pulse"></div></div>' +
      '<div class="tl-label">' + n.label + '</div><div class="tl-time">' + (n.time || '') + '</div></div>';
  }).join('');
}

/* ===================== 抢单 / 状态流转 ===================== */
function grabOrder(id) {
  var o = state.hall.filter(function (x) { return x.id === id; })
    .concat(state.orders.filter(function (x) { return x.status === 'published' && x.id === id; }))[0];
  if (!o) return toast('手慢了,该订单已被接走或已取消');
  var lowBal = state.balance < o.fee;
  modal('<div class="modal-title">确认接' + o.equip + '单</div>' +
    '<div class="modal-body">接单将从钱包扣除服务费 <b>¥' + o.fee + '</b>(当前余额 ¥' + fmtBal() + '),抢不到自动退回。</div>' +
    '<div class="modal-btns">' +
    '<button class="modal-btn modal-btn--sub" onclick="closeModal()">再想想</button>' +
    (lowBal
      ? '<button class="modal-btn modal-btn--main" onclick="closeModal();goM(\'wallet\')">去充值</button>'
      : '<button class="modal-btn modal-btn--main" onclick="doGrab(\'' + id + '\')">确认接单</button>') +
    '</div>');
}
function doGrab(id) {
  var hidx = -1;
  for (var i = 0; i < state.hall.length; i++) if (state.hall[i].id === id) hidx = i;
  var o = state.orders.filter(function (x) { return x.id === id; })[0] ||
          (hidx > -1 ? state.hall[hidx] : null);
  if (!o) { closeModal(); return toast('手慢了,该订单已被接走或已取消'); }
  if (hidx > -1) state.hall.splice(hidx, 1);
  state.balance -= o.fee;
  state.logs.unshift({ t: '接单扣费', amt: -o.fee, sub: '今天 ' + nowHM() + ' · ' + (o.orderNo || '大厅订单') });
  var target = state.orders.filter(function (x) { return x.id === id; })[0];
  if (target) {
    target.status = 'accepted';
    target.master = MASTER;
    target.timeline.accept = nowHM();
  }
  closeModal();
  state.pageM = 'hall';
  render();
  modal('<div class="modal-title">抢单成功</div><div class="modal-body">已扣接单费 ¥' + o.fee + '。请尽快联系客户约定上门:<br><b>' + USER.phone + ' (' + USER.name + ')</b></div>' +
    '<div class="modal-btns"><button class="modal-btn modal-btn--sub" onclick="closeModal()">知道了</button>' +
    '<button class="modal-btn modal-btn--main" onclick="closeModal();openDetailM(\'' + id + '\')">查看订单</button></div>');
}
function openDetailU(id) { state.detailU = id; state.pageU = 'uDetail'; render(); }
function openDetailM(id) { state.detailM = id; state.pageM = 'mDetail'; render(); }

function cancelOrder() {
  var o = state.orders.filter(function (x) { return x.id === state.detailU; })[0];
  if (!o) return;
  modal('<div class="modal-title">取消订单</div><div class="modal-body">确定取消这个订单吗?取消后师傅将无法再接单。</div>' +
    '<div class="modal-btns"><button class="modal-btn modal-btn--sub" onclick="closeModal()">再想想</button>' +
    '<button class="modal-btn modal-btn--main" style="background:var(--danger)" onclick="doCancel()">确定取消</button></div>');
}
function doCancel() {
  var o = state.orders.filter(function (x) { return x.id === state.detailU; })[0];
  if (o) { o.status = 'cancelled'; o.timeline.confirm = nowHM(); }
  state.hall = state.hall.filter(function (x) { return x.id !== (o && o.id); });
  closeModal(); toast('订单已取消'); render();
}
function finishOrder() {
  var o = state.orders.filter(function (x) { return x.id === state.detailM; })[0];
  if (!o) return;
  o.status = 'pending_confirm'; o.timeline.finish = nowHM();
  toast('已提交完成,等待用户确认'); render();
}
function undoFinish() {
  var o = state.orders.filter(function (x) { return x.id === state.detailM; })[0];
  if (!o) return;
  o.status = 'accepted'; o.timeline.finish = '';
  toast('已撤销完成'); render();
}
function confirmComplete() {
  var o = state.orders.filter(function (x) { return x.id === state.detailU; })[0];
  if (!o) return;
  o.status = 'completed'; o.timeline.confirm = nowHM();

}

function submitReview() {

var concRunning = false;
function runConc() {
  if (concRunning) return;
  concRunning = true;
  var a = $('cpA'), b = $('cpB'), btnA = $('cpBtnA'), btnB = $('cpBtnB'), go = $('concGo');
  if (!a || !b) { concRunning = false; return; }
  btnA.disabled = true; btnB.disabled = true; go.disabled = true; go.style.opacity = .5;
  a.classList.add('racing'); b.classList.add('racing');
  $('cpResA').textContent = '正在抢单…'; $('cpResB').textContent = '正在抢单…';
  setTimeout(function () {
    a.classList.remove('racing'); b.classList.remove('racing');
    a.classList.add('won'); b.classList.add('lost');
    $('cpResA').innerHTML = '✅ 抢单成功<br>已扣接单费 ¥20,余额 ¥240';
    $('cpResB').innerHTML = '❌ 手慢了,该订单已被接走或已取消<br>接单费已退回,余额 ¥180';
    concRunning = false;
    if (go) go.textContent = '↺ 再看一遍';
    if (go) { go.disabled = false; go.style.opacity = 1; go.onclick = function () { concRunning = false; openConc(); }; }
  }, 900);
}

/* ===================== 启动 ===================== */
state = freshState();
(function () {
  var h = location.hash.replace('#', '');
  if (h === 'publish') { state.pageU = 'publish'; }
  if (h === 'detail') {
    var eq = equipByKey('homeAc'), cat = catByKey('repair');
    var o = { id: 'U0', orderNo: makeOrderNo(), catKey: 'repair', catName: cat.name, equip: eq.name, scene: 'home',
      sceneLabel: '家用', fee: 20, desc: '格力挂机,开机后不制冷,外机风扇不转,用了大概5年',
      addr: '青岛市南区宁夏路118号弘诚山庄', expectTime: '9月2日 上午', status: 'accepted', publishedAt: '14:02',
      timeline: { pub: '14:02', accept: '14:10', finish: '', confirm: '' }, master: MASTER, reviewed: false, urgent: '', photos: 1 };
    state.orders.push(o);
    state.detailU = 'U0'; state.pageU = 'uDetail';
    state.detailM = 'U0'; state.pageM = 'mDetail';
  }
})();
render();
